body{margin:0;font-family:Poppins;background:#f6f7f9}
header{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.header-inner{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center;padding:10px}
.logo img{width:60px}
.logo{
  display:flex;
  align-items:center;
  gap:1px;
}

.colors{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:5px;
}

.color-tag{
  background:#111;
  color:#fff;
  border:1px solid #333;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}
  
  .verified-img{
  width:30px;
  height:30px;
  object-fit:contain;
}

.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#1d9bf0; /* azul verificado */
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.search{flex:1}
.search input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
.cart-top{
  font-weight:700;
  cursor:pointer;
  margin-left:16px;
  white-space:nowrap;
}

.cat-nav{
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}

.cat-nav::-webkit-scrollbar{
  display: none;
}

.cat-nav button{
  flex: 0 0 auto;
}

.cat-nav button{border:none;background:#fff;padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer}
.cat-nav button.active{background:#000;color:#fff}

.minimo{max-width:1200px;margin:auto;background:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:600}

.main{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

.card{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gallery{padding:10px;background:#fafafa}

  .main-img{
  width:100%;
  height:320px;
  object-fit:cover;
  border-radius:12px;
}
  
.thumbs{display:flex;justify-content:center;gap:8px;margin-top:8px}
.thumbs img{width:50px;height:40px;opacity:.6;border-radius:6px;cursor:pointer}
.thumbs img.active{opacity:1;border:2px solid #000}

.meta{padding:14px;display:flex;flex-direction:column;gap:8px}
.title{font-weight:700}
.price{font-weight:800}
select{padding:8px;border-radius:8px;border:1px solid #ddd}

.actions{display:flex;gap:8px;margin-top:auto}
.buy,.add-cart{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.buy{background:#000;color:#fff}
.add-cart{background:#eee}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-content{background:#fff;width:95%;max-width:500px;border-radius:16px;padding:20px}
.cart-item{display:flex;justify-content:space-between;margin-bottom:8px}
.remove{background:#eee;border:none;border-radius:6px;padding:4px 8px;cursor:pointer}

footer{text-align:center;padding:20px;color:#666}
.desc{
  font-size:14px;
  line-height:1.6;
  color:#444;
  white-space:pre-line;
  max-height:280px;
  overflow-y:auto;

const catalog=document.getElementById("catalog");

function render(cat="all"){
  catalog.innerHTML="";
  PRODUCTS.filter(p=>cat==="all"||p.category===cat).forEach(p=>{
    const firstPrice=Object.values(p.variants)[0];
   const card=document.createElement("div");
card.className="card";

card.innerHTML = `
  <div class="title">${p.title}</div>

 <div class="colors">
  ${p.colors
    ? Object.keys(p.colors).map(c =>
        `<span class="color-tag">${c}</span>`
      ).join("")
    : ""
  }
</div>

 <div class="price">
  ${fmt(Object.values(p.variants)[0])}
</div>

  <button>Comprar</button>

  <div class="gallery">
    <img src="${p.images[0]}" class="main-img">
    <div class="thumbs">
      ${p.images.map((img,i)=>`<img src="${img}">`).join("")}
    </div>
  </div>
`;
    const mainImg=card.querySelector(".main-img");
    mainImg.onclick = ()=>openProduct(p);
    card.querySelectorAll(".thumbs img").forEach(t=>{
      t.onclick=()=>{
        card.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));
        t.classList.add("active");
        mainImg.src=t.src;
      };
    });

    const sel=card.querySelector("select");
    const priceEl=card.querySelector(".price");
    sel.onchange=()=>priceEl.textContent=fmt(sel.value);

    card.querySelector(".add-cart").onclick=()=>{
  cart.push({
    title: p.title,
    variant: sel.options[sel.selectedIndex].text,
    price: sel.value,
    image: p.images[0] // 👈 CLAVE
  });
  cartTotal += Number(sel.value);
  updateCartUI();
};

   card.querySelector(".buy").onclick = ()=>{
  const price = Number(sel.value);

  cart.length = 0;
  cartTotal = price;

  cart.push({
    title: p.title,
    variant: sel.options[sel.selectedIndex].text,
    price: price,
    image: p.images[0]
  });

  updateCartUI();
  openCart();
};
    
catalog.appendChild(card);
  });
}

function updateCartUI(){
  document.getElementById("cartTotal").textContent=fmt(cartTotal);
}

  const list = document.getElementById("cartItems");
  list.innerHTML = "";

  cart.forEach((p,i)=>{
    list.innerHTML += `
      <div class="cart-item" style="align-items:center;gap:10px">
        <img src="${p.image}" style="width:45px;height:45px;object-fit:contain;border-radius:6px;background:#f5f5f5">
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${p.title}</div>
          <div style="font-size:12px;color:#666">${p.variant}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700">${fmt(p.price)}</div>
          <button class="remove" onclick="removeItem(${i})">✕</button>
        </div>
      </div>
    `;
  });

  document.getElementById("cartModalTotal").textContent =
    "Total: " + fmt(cartTotal);

  cartModal.style.display = "flex";
}
function closeCart(){cartModal.style.display="none"}

function removeItem(i){
  cartTotal-=Number(cart[i].price);
  cart.splice(i,1);
  updateCartUI();
  openCart();
}

function finalizarCarrito(){

  if(!validarDijeEnCarrito()) return;


  const msg=encodeURIComponent(
    `🛒 Pedido AD Studio\n`+
    cart.map(p=>`• ${p.title} (${p.variant}) - ${fmt(p.price)}`).join("\n")+
    `\nTotal: ${fmt(cartTotal)}`
  );
  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank");
}

document.querySelectorAll(".cat-nav button").forEach(b=>{
  b.onclick=()=>{

    // activar botón
    document.querySelectorAll(".cat-nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");

    // animación salida
    catalog.classList.add("fade-out");

    setTimeout(()=>{
      render(b.dataset.cat);

      catalog.classList.remove("fade-out");
      catalog.classList.add("fade-in");
    }, 200);
  };
});

function openProduct(p){

  const modal = document.getElementById("productModal");
  const track = document.getElementById("pm-track");
  const thumbs = document.getElementById("pm-thumbs");
  const title = document.getElementById("pm-title");
  const price = document.getElementById("pm-price");
  const variants = document.getElementById("pm-variants");
  const desc = document.getElementById("pm-desc");

  let currentIndex = 0;

  // Carrusel
  track.innerHTML = p.images.map(img => `<img src="${img}">`).join("");
  track.style.transform = "translateX(0%)";

  // Thumbs
  thumbs.innerHTML = "";
  p.images.forEach((img, index) => {
    const t = document.createElement("img");
    t.src = img;
    if(index === 0) t.classList.add("active");

    t.onclick = () => {
      currentIndex = index;
      track.style.transform = `translateX(-${index * 100}%)`;
      thumbs.querySelectorAll("img").forEach(i => i.classList.remove("active"));
      t.classList.add("active");
    };

    thumbs.appendChild(t);
  });

  // Texto
  title.textContent = p.title;
  desc.textContent = p.desc || "";

  // Variantes
  variants.innerHTML = "";
  Object.entries(p.variants).forEach(([k,v],i)=>{
    const o = document.createElement("option");
    o.value = v;
    o.textContent = k;
    variants.appendChild(o);
    if(i===0) price.textContent = fmt(v);
  });

  variants.onchange = ()=> price.textContent = fmt(variants.value);

  modal.style.display = "flex";
}

function closeProduct(){
  document.getElementById("productModal").style.display = "none";
}

function validarDijeEnCarrito(){
  return true;
}

window.onload = () => {
  render();
};

let startX = 0;
let isSwiping = false;
let currentIndex = 0;

const modal = document.getElementById("productModal");
const slider = modal ? modal.querySelector(".main-slider") : null;

if (slider) {
  slider.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    isSwiping = true;
  }, { passive: true });

  slider.addEventListener("touchend", e => {
    if (!isSwiping) return;

    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if (Math.abs(diff) < 40) {
      isSwiping = false;
      return;
    }

    const track = slider.querySelector(".main-track");
    const imgs = track.querySelectorAll("img");

    if (diff > 0 && currentIndex < imgs.length - 1) currentIndex++;
    if (diff < 0 && currentIndex > 0) currentIndex--;

    track.style.transform = `translateX(-${currentIndex * 100}%)`;

    const thumbs = document.getElementById("pm-thumbs");
    if (thumbs) {
      thumbs.querySelectorAll("img").forEach((t, i) => {
        t.classList.toggle("active", i === currentIndex);
      });
    }

    isSwiping = false;
  }, { passive: true });
}

</script>
