const catalog=document.getElementById("catalog");

let currentCategory = "all";
function render(cat="all"){
  catalog.innerHTML="";
  let productos = PRODUCTS.filter(
    p => cat === "all" || p.category === cat
);

const order = document.getElementById("sortProducts")?.value;
const getMinPrice = (p) =>
  Math.min(...Object.values(p.variants).map(Number));
  
switch(order){

  case "az":
    productos.sort((a,b)=>a.title.localeCompare(b.title));
    break;

  case "za":
    productos.sort((a,b)=>b.title.localeCompare(a.title));
    break;

  case "priceAsc":
    productos.sort((a,b)=>getMinPrice(a)-getMinPrice(b));
    break;

  case "priceDesc":
    productos.sort((a,b)=>getMinPrice(b)-getMinPrice(a));
    break;
}
  productos.forEach(p => {

  const firstPrice = Object.values(p.variants)[0];

const imgs =
  p.images ||
  Object.values(p.colors || {})[0] ||
  [];
  const card = document.createElement("div");
  card.className = "card";

 card.innerHTML = `

<img class="main-img" src="${imgs[0] || ""}">

<div class="thumbs">
  ${imgs.map(img => `<img src="${img}">`).join("")}
</div>

<div class="title">${p.title}</div>

<div class="colors">
  ${p.colors
    ? Object.keys(p.colors)
        .map(c => `<span class="color-tag">${c}</span>`)
        .join("")
    : ""
  }
</div>

    <select>
      <option value="" selected disabled>Seleccionar talle</option>

      ${Object.entries(p.variants)
        .map(([k,v]) => `<option value="${v}">${k}</option>`)
        .join("")}
    </select>

    <div class="price">
      ${fmt(firstPrice)}
    </div>

    <div class="actions">
      <button class="add-cart">Agregar</button>
      <button class="buy">Comprar</button>
    </div>

  </div>
`;
    const mainImg = card.querySelector(".main-img");

// mainImg.onclick = () => openProduct(p);

// Miniaturas
card.querySelectorAll(".thumbs img").forEach(t => {
  t.onclick = () => {
    card.querySelectorAll(".thumbs img")
      .forEach(x => x.classList.remove("active"));

    t.classList.add("active");
// mainImg.src = t.src;
  };
});

// 👇 COLOCAR ESTO DEBAJO
if (p.colors) {
  card.querySelectorAll(".color-tag").forEach(tag => {

    tag.onclick = () => {

  // Si ya estaba seleccionado, lo deselecciona
  if (tag.classList.contains("active")) {
    tag.classList.remove("active");
    return;
  }

  // Quita la selección de los demás
  card.querySelectorAll(".color-tag")
    .forEach(x => x.classList.remove("active"));

  // Selecciona este
  tag.classList.add("active");

  const color = tag.textContent;

      console.log("Color clickeado:", color);
      console.log("Imágenes:", p.colors[color]);

      const nuevasImgs = p.colors[color];

      if (!nuevasImgs) return;

      // mainImg.src = nuevasImgs[0];

      const thumbs = card.querySelector(".thumbs");

      thumbs.innerHTML = nuevasImgs
        .map(img => `<img src="${img}">`)
        .join("");

      thumbs.querySelectorAll("img").forEach(t => {
        t.onclick = () => {
          mainImg.src = t.src;
        };
      });

    };

  });
}
    const sel=card.querySelector("select");
    const priceEl=card.querySelector(".price");
    sel.onchange=()=>priceEl.textContent=fmt(sel.value);

card.querySelector(".add-cart").onclick = () => {

    const tieneColores = p.colors && Object.keys(p.colors).length > 0;

    if (tieneColores) {

        const colorSeleccionado = card.querySelector(".color-tag.active");

        if (!colorSeleccionado) {
            alert("Seleccioná un color.");
            return;
        }

    }

    if (sel.value === "") {
        alert("Seleccioná un talle.");
        return;
    }

    cart.push({
        title: p.title,
        variant: sel.options[sel.selectedIndex].text,
        price: sel.value,
        image: imgs[0]
    });

    cartTotal += Number(sel.value);

    updateCartUI();

};
    
card.querySelector(".buy").onclick = () => {

    const tieneColores = p.colors && Object.keys(p.colors).length > 0;

    if (tieneColores) {

        const colorSeleccionado = card.querySelector(".color-tag.active");

        if (!colorSeleccionado) {
            alert("Seleccioná un color.");
            return;
        }

    }

    if (sel.value === "") {
        alert("Seleccioná un talle.");
        return;
    }

    const price = Number(sel.value);

    cart.length = 0;
    cartTotal = price;

    cart.push({
        title: p.title,
        variant: sel.options[sel.selectedIndex].text,
        price: price,
        image: imgs[0]
    });

    updateCartUI();
    openCart();

};
    
catalog.appendChild(card);
  });
  }
  
function updateCartUI(){
  document.getElementById("cartTotal").textContent=fmt(cartTotal);
}

function openCart(){
  const list = document.getElementById("cartItems");
  list.innerHTML = "";

  cart.forEach((p,i)=>{
    list.innerHTML += `
      <div class="cart-item" style="align-items:center;gap:10px">
        <img src="${p.image}" style="width:45px;height:45px;object-fit:contain;border-radius:6px;background:#f5f5f5">
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${p.title}</div>
          <div style="font-size:12px;color:#666">${p.variant}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700">${fmt(p.price)}</div>
          <button class="remove" onclick="removeItem(${i})">✕</button>
        </div>
      </div>
    `;
  });

  document.getElementById("cartModalTotal").textContent =
    "Total: " + fmt(cartTotal);

  cartModal.style.display = "flex";
}
function closeCart(){cartModal.style.display="none"}

function openClientModal(){

    closeCart();

    document.getElementById("clientModal").style.display = "flex";

}

function closeClientModal(){

    document.getElementById("clientModal").style.display = "none";

}
  
function removeItem(i){
  cartTotal-=Number(cart[i].price);
  cart.splice(i,1);
  updateCartUI();
  openCart();
}

function finalizarCarrito(){

    if(!validarDijeEnCarrito()) return;

    document.getElementById("clientModal").style.display = "flex";

}

function closeClientModal(){

    document.getElementById("clientModal").style.display = "none";

}

function continuarCompra(){

    const obligatorios = [
        "cNombre",
        "cTelefono",
        "cProvincia",
        "cCiudad",
        "cDireccion",
        "cCP"
    ];

    for(const id of obligatorios){

        const campo = document.getElementById(id);

        if(campo.value.trim() === ""){

            alert("Completá todos los campos obligatorios.");
            campo.focus();
            return;

        }

    }

    alert("Perfecto. En el siguiente paso mostraremos el resumen del pedido.");

}
document.querySelectorAll(".cat-nav button").forEach(b=>{
  b.onclick=()=>{
currentCategory = b.dataset.cat;
    // activar botón
    document.querySelectorAll(".cat-nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");

    // animación salida
    catalog.classList.add("fade-out");

    setTimeout(()=>{
      render(b.dataset.cat);

      catalog.classList.remove("fade-out");
      catalog.classList.add("fade-in");
    }, 200);
  };
});

function openProduct(p){

  const modal = document.getElementById("productModal");
  const track = document.getElementById("pm-track");
  const thumbs = document.getElementById("pm-thumbs");
  const title = document.getElementById("pm-title");
  const price = document.getElementById("pm-price");
  const variants = document.getElementById("pm-variants");
  const desc = document.getElementById("pm-desc");

  let currentIndex = 0;

  // Carrusel
  track.innerHTML = p.images.map(img => `<img src="${img}">`).join("");
  track.style.transform = "translateX(0%)";

  // Thumbs
  thumbs.innerHTML = "";
  p.images.forEach((img, index) => {
    const t = document.createElement("img");
    t.src = img;
    if(index === 0) t.classList.add("active");

    t.onclick = () => {
      currentIndex = index;
      track.style.transform = `translateX(-${index * 100}%)`;
      thumbs.querySelectorAll("img").forEach(i => i.classList.remove("active"));
      t.classList.add("active");
    };

    thumbs.appendChild(t);
  });

  // Texto
  title.textContent = p.title;
  desc.textContent = p.desc || "";

  // Variantes
  variants.innerHTML = "";
  Object.entries(p.variants).forEach(([k,v],i)=>{
    const o = document.createElement("option");
    o.value = v;
    o.textContent = k;
    variants.appendChild(o);
    if(i===0) price.textContent = fmt(v);
  });

  variants.onchange = ()=> price.textContent = fmt(variants.value);

  modal.style.display = "flex";
}

function closeProduct(){
  document.getElementById("productModal").style.display = "none";
}

function validarDijeEnCarrito(){
  return true;
}
document.getElementById("sortProducts").addEventListener("change", () => {
    render(currentCategory);
});
  
window.onload = () => {
  render();
};

let startX = 0;
let isSwiping = false;
let currentIndex = 0;

const modal = document.getElementById("productModal");
const slider = modal ? modal.querySelector(".main-slider") : null;

if (slider) {
  slider.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    isSwiping = true;
  }, { passive: true });

  slider.addEventListener("touchend", e => {
    if (!isSwiping) return;

    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if (Math.abs(diff) < 40) {
      isSwiping = false;
      return;
    }

    const track = slider.querySelector(".main-track");
    const imgs = track.querySelectorAll("img");

    if (diff > 0 && currentIndex < imgs.length - 1) currentIndex++;
    if (diff < 0 && currentIndex > 0) currentIndex--;

    track.style.transform = `translateX(-${currentIndex * 100}%)`;

    const thumbs = document.getElementById("pm-thumbs");
    if (thumbs) {
      thumbs.querySelectorAll("img").forEach((t, i) => {
        t.classList.toggle("active", i === currentIndex);
      });
    }

    isSwiping = false;
  }, { passive: true });
}
